# Axe Build — self-hosted Expo Android build service, localhost only, fully containerized.
#
# Machine safety:
#   - No privileged mode, no docker socket mount, no Docker-in-Docker.
#   - All mutable state lives in the named volumes below.
#   - Worker has hard memory/cpu limits so a runaway Gradle cannot freeze the host.
#   - `docker compose down -v --remove-orphans` removes everything and leaves the host pristine.
#
# Works with `docker compose` and `podman compose` alike.

# Frozen on purpose. The Compose project name prefixes every named volume
# (mybuild_db-data, mybuild_android-sdk, ...), so renaming it here would point a
# running install at empty volumes: build history gone, artifacts gone, and
# several GB of Android SDK downloaded again. Renaming is safe only before the
# very first `make up`.
name: mybuild

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis-data:/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: axebuild-web
    restart: unless-stopped
    depends_on:
      - redis
    # Reachable from the home LAN (0.0.0.0). Still do NOT port-forward 3000 on
    # your router: the supported way to reach this from outside is a tunnel
    # plus PUBLIC_HOSTNAME below, which exposes only the read-only update
    # endpoints. A port-forward would expose the whole dashboard instead.
    # Note BIND_ADDR=127.0.0.1 only works if cloudflared runs on this machine.
    ports:
      - "${BIND_ADDR:-0.0.0.0}:3000:3000"
    environment:
      DATABASE_URL: "file:/data/db/mybuild.db"
      REDIS_URL: "redis://redis:6379"
      LOCAL_TOKEN: "${LOCAL_TOKEN:-dev-local-token}"
      # The hostname this server is published on through the Cloudflare tunnel.
      # Requests arriving on it are restricted to the read-only update
      # endpoints; the dashboard (which embeds LOCAL_TOKEN in its HTML) and
      # every write route 404 there. LAN addresses are unaffected.
      # Defaulted rather than left empty so a missing .env fails CLOSED.
      # Read at container start, not baked into the image — changing it needs
      # only a restart. See apps/web/src/middleware.ts.
      PUBLIC_HOSTNAME: "${PUBLIC_HOSTNAME:-updates.manzaronline.site}"
      UPLOADS_DIR: /data/uploads
      ARTIFACTS_DIR: /data/artifacts
      KEYSTORES_DIR: /data/keystores
    volumes:
      - db-data:/data/db
      - uploads:/data/uploads
      # Upload keys, one per project. Writable here because this is the side
      # that receives the upload; the worker only ever reads them.
      - keystores:/data/keystores
      # Writable, not :ro — deleting a build from the dashboard removes its
      # artifact directory here. The worker is still the only thing that
      # *writes* build output; the web app only ever serves it or deletes it.
      - artifacts:/data/artifacts

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: axebuild-worker
    restart: unless-stopped
    depends_on:
      - redis
      - web
    # Hard caps: a runaway Gradle build can never take down the host.
    # Sized for a 4-core/15GB server: leave 1 full core + ~5-6GB free for the
    # OS, redis, web, and anything else running there. Adjust to your actual
    # hardware — never raise cpus to the host's full core count.
    mem_limit: 9g
    memswap_limit: 9g
    cpus: 3
    environment:
      DATABASE_URL: "file:/data/db/mybuild.db"
      REDIS_URL: "redis://redis:6379"
      UPLOADS_DIR: /data/uploads
      ARTIFACTS_DIR: /data/artifacts
      KEYSTORES_DIR: /data/keystores
      WORKSPACES_DIR: /workspaces
      GRADLE_USER_HOME: /cache/gradle
      npm_config_cache: /cache/npm
      # Downloaded once into the android-sdk volume by the worker entrypoint,
      # never baked into the image. Edit this to add SDK packages: the next
      # start pulls only what's missing.
      ANDROID_SDK_PACKAGES: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.30.5"
      # Gradle build JVM stays well inside the container's 9g budget
      # (written to $GRADLE_USER_HOME/gradle.properties by the entrypoint).
      GRADLE_JVM_ARGS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
      # ccache makes repeat native (C++) compilation nearly free. Same mechanism
      # EAS uses; the cache persists in its own volume across builds.
      ANDROID_CCACHE: /usr/bin/ccache
      CCACHE_DIR: /cache/ccache
      CCACHE_MAXSIZE: 5G
      # 2h. A cold first build downloads every npm + Maven dependency over the
      # home connection; killing it mid-Gradle just wastes the work done so far.
      BUILD_TIMEOUT_MS: "7200000"
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    volumes:
      - db-data:/data/db
      - uploads:/data/uploads:ro
      # :ro — a build signs with the key, it never changes it.
      - keystores:/data/keystores:ro
      - artifacts:/data/artifacts
      - workspaces:/workspaces
      - android-sdk:/opt/android-sdk
      - gradle-cache:/cache/gradle
      - npm-cache:/cache/npm
      - ccache:/cache/ccache

volumes:
  redis-data:
  db-data:
  uploads:
  # Upload keys. Losing this volume means Play will not accept another build of
  # an app already published with the key it held -- back it up off this
  # machine, the same as any signing key.
  keystores:
  artifacts:
  workspaces:
  # The Android SDK/NDK. Survives image rebuilds and `make nuke` on purpose —
  # it is several GB over a home connection. `make nuke-sdk` drops it.
  android-sdk:
  gradle-cache:
  npm-cache:
  ccache:
